# ══════════════════════════════════════════════════════
#  render.yaml — NoomCoin Backend + Bot (Single Service)
#  Upload this folder to GitHub → connect to Render
# ══════════════════════════════════════════════════════
services:
  - type: web
    name: noomcoinbackend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: RENDER_BOT_URL
        value: https://noomcoinbackend.onrender.com
      # ── Set these in Render Dashboard → Environment ──
      - key: MONGODB_URI
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: MIN_WITHDRAWAL
        value: "100000"
